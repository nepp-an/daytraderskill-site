<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="begTitle begDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="begTitle">A four-stage beginner path</title>
  <desc id="begDesc">Mechanics, one written process, paper repetitions, then journal review. A study sequence, not a performance promise.</desc>
  <defs>
    <linearGradient id="begBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111e29"/>
      <stop offset="1" stop-color="#0a1219"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" rx="20" fill="url(#begBg)"/>
  <path d="M0 0H720V320H0z" fill="none" stroke="#263648"/>

  <text x="32" y="44" fill="#59d39a" font-size="11" font-weight="700" letter-spacing="2.2">BEGINNER PATH</text>
  <text x="32" y="76" fill="#eef5fb" font-size="23" font-weight="750" letter-spacing="-.4">Learn the loop before adding money</text>

  <path d="M74 166H646" stroke="#33506a" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M74 166H290" stroke="#59d39a" stroke-width="2.5"/>

  <g>
    <circle cx="74" cy="166" r="26" fill="#10231c" stroke="#59d39a" stroke-width="2"/>
    <text x="74" y="172" text-anchor="middle" fill="#9af0c7" font-size="16" font-weight="800">1</text>
    <text x="44" y="220" fill="#e9f0f7" font-size="14" font-weight="700">Mechanics</text>
    <text x="44" y="241" fill="#93a8bc" font-size="11">Orders, spreads,</text>
    <text x="44" y="257" fill="#93a8bc" font-size="11">liquidity</text>
  </g>

  <g>
    <circle cx="264" cy="166" r="26" fill="#101c27" stroke="#6fa8ee" stroke-width="2"/>
    <text x="264" y="172" text-anchor="middle" fill="#c6ddff" font-size="16" font-weight="800">2</text>
    <text x="226" y="220" fill="#e9f0f7" font-size="14" font-weight="700">One process</text>
    <text x="218" y="241" fill="#93a8bc" font-size="11">Entry, invalidation,</text>
    <text x="238" y="257" fill="#93a8bc" font-size="11">size, stop rule</text>
  </g>

  <g>
    <circle cx="454" cy="166" r="26" fill="#191a2b" stroke="#b39af2" stroke-width="2"/>
    <text x="454" y="172" text-anchor="middle" fill="#ded3ff" font-size="16" font-weight="800">3</text>
    <text x="414" y="220" fill="#e9f0f7" font-size="14" font-weight="700">Paper reps</text>
    <text x="406" y="241" fill="#93a8bc" font-size="11">Same routine,</text>
    <text x="422" y="257" fill="#93a8bc" font-size="11">simulated fills</text>
  </g>

  <g>
    <circle cx="644" cy="166" r="26" fill="#221e12" stroke="#e5bd6b" stroke-width="2"/>
    <text x="644" y="172" text-anchor="middle" fill="#ffe4a4" font-size="16" font-weight="800">4</text>
    <text x="608" y="220" fill="#e9f0f7" font-size="14" font-weight="700">Review</text>
    <text x="588" y="241" fill="#93a8bc" font-size="11">Journal decisions,</text>
    <text x="598" y="257" fill="#93a8bc" font-size="11">then adjust</text>
  </g>

  <text x="32" y="294" fill="#6f8398" font-size="11">Illustration only · no market data · most people who day trade lose money</text>
</svg>
