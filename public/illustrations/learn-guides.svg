<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="learnTitle learnDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="learnTitle">A reading order for the day trading guides on this hub</title>
  <desc id="learnDesc">Start with the definition, then the beginner pillar, then the how-to-start roadmap. Practice stays on paper.</desc>
  <defs>
    <linearGradient id="learnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d29"/>
      <stop offset="1" stop-color="#0a1219"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" rx="20" fill="url(#learnBg)"/>
  <rect x=".5" y=".5" width="719" height="319" rx="19.5" fill="none" stroke="#263648"/>

  <text x="32" y="42" fill="#6fa8ee" font-size="11" font-weight="700" letter-spacing="2.2">READING ORDER</text>
  <text x="32" y="73" fill="#eef5fb" font-size="23" font-weight="750" letter-spacing="-.4">Three guides, one paper-first path</text>

  <g>
    <rect x="32" y="100" width="204" height="168" rx="13" fill="#101c27" stroke="#2b4357"/>
    <text x="52" y="128" fill="#6fa8ee" font-size="11" font-weight="800" letter-spacing=".8">GUIDE 01</text>
    <text x="52" y="164" fill="#e9f0f7" font-size="16" font-weight="700">What is</text>
    <text x="52" y="186" fill="#e9f0f7" font-size="16" font-weight="700">day trading?</text>
    <text x="52" y="218" fill="#93a8bc" font-size="12">Definition and how it</text>
    <text x="52" y="236" fill="#93a8bc" font-size="12">differs from swing</text>
    <text x="52" y="254" fill="#93a8bc" font-size="12">trading and investing.</text>
  </g>

  <g>
    <rect x="258" y="100" width="204" height="168" rx="13" fill="#10231c" stroke="#2f5c4a"/>
    <text x="278" y="128" fill="#59d39a" font-size="11" font-weight="800" letter-spacing=".8">GUIDE 02</text>
    <text x="278" y="164" fill="#e9f0f7" font-size="16" font-weight="700">Day trading for</text>
    <text x="278" y="186" fill="#e9f0f7" font-size="16" font-weight="700">beginners</text>
    <text x="278" y="218" fill="#93a8bc" font-size="12">Skills, costs, mistakes,</text>
    <text x="278" y="236" fill="#93a8bc" font-size="12">and what to learn</text>
    <text x="278" y="254" fill="#93a8bc" font-size="12">before risking capital.</text>
  </g>

  <g>
    <rect x="484" y="100" width="204" height="168" rx="13" fill="#191a2b" stroke="#473f6d"/>
    <text x="504" y="128" fill="#b39af2" font-size="11" font-weight="800" letter-spacing=".8">GUIDE 03</text>
    <text x="504" y="164" fill="#e9f0f7" font-size="16" font-weight="700">How to start</text>
    <text x="504" y="186" fill="#e9f0f7" font-size="16" font-weight="700">day trading</text>
    <text x="504" y="218" fill="#93a8bc" font-size="12">A step-by-step roadmap</text>
    <text x="504" y="236" fill="#93a8bc" font-size="12">from mechanics to a</text>
    <text x="504" y="254" fill="#93a8bc" font-size="12">reviewed paper session.</text>
  </g>

  <text x="32" y="300" fill="#6f8398" font-size="11">Illustration only · hub map, not the full guides · not financial advice</text>
