<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="whatTitle whatDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="whatTitle">Day trading compared with swing trading and investing</title>
  <desc id="whatDesc">Three time horizons: day trading closes within the session, swing trading holds days to weeks, and investing holds months to years.</desc>
  <defs>
    <linearGradient id="whatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d29"/>
      <stop offset="1" stop-color="#0a1219"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" rx="20" fill="url(#whatBg)"/>
  <rect x=".5" y=".5" width="719" height="319" rx="19.5" fill="none" stroke="#263648"/>

  <text x="32" y="42" fill="#59d39a" font-size="11" font-weight="700" letter-spacing="2.2">THREE HORIZONS</text>
  <text x="32" y="73" fill="#eef5fb" font-size="23" font-weight="750" letter-spacing="-.4">Day trading is defined by the holding period</text>

  <g>
    <rect x="32" y="100" width="204" height="168" rx="13" fill="#10231c" stroke="#2f5c4a"/>
    <circle cx="60" cy="132" r="8" fill="none" stroke="#59d39a" stroke-width="2"/>
    <path d="M60 126v6l4 2" stroke="#59d39a" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="137" fill="#9af0c7" font-size="11" font-weight="800" letter-spacing=".8">DAY</text>
    <text x="52" y="174" fill="#e9f0f7" font-size="16" font-weight="700">Same session</text>
    <text x="52" y="200" fill="#93a8bc" font-size="12">Positions normally closed</text>
    <text x="52" y="218" fill="#93a8bc" font-size="12">before the close.</text>
    <text x="52" y="246" fill="#6f8398" font-size="11">Intraday price movement</text>
  </g>

  <g>
    <rect x="258" y="100" width="204" height="168" rx="13" fill="#101c27" stroke="#2b4357"/>
    <circle cx="286" cy="132" r="8" fill="none" stroke="#6fa8ee" stroke-width="2"/>
    <path d="M286 126v6l4 2" stroke="#6fa8ee" stroke-width="2" stroke-linecap="round"/>
    <text x="308" y="137" fill="#c6ddff" font-size="11" font-weight="800" letter-spacing=".8">SWING</text>
    <text x="278" y="174" fill="#e9f0f7" font-size="16" font-weight="700">Days to weeks</text>
    <text x="278" y="200" fill="#93a8bc" font-size="12">Overnight exposure is</text>
    <text x="278" y="218" fill="#93a8bc" font-size="12">part of the approach.</text>
    <text x="278" y="246" fill="#6f8398" font-size="11">Multi-day moves</text>
  </g>

  <g>
    <rect x="484" y="100" width="204" height="168" rx="13" fill="#191a2b" stroke="#473f6d"/>
    <circle cx="512" cy="132" r="8" fill="none" stroke="#b39af2" stroke-width="2"/>
    <path d="M512 126v6l4 2" stroke="#b39af2" stroke-width="2" stroke-linecap="round"/>
    <text x="534" y="137" fill="#ded3ff" font-size="11" font-weight="800" letter-spacing=".8">INVEST</text>
    <text x="504" y="174" fill="#e9f0f7" font-size="16" font-weight="700">Months to years</text>
    <text x="504" y="200" fill="#93a8bc" font-size="12">Long-term ownership and</text>
    <text x="504" y="218" fill="#93a8bc" font-size="12">compounding.</text>
    <text x="504" y="246" fill="#6f8398" font-size="11">Business or portfolio focus</text>
  </g>

  <text x="32" y="300" fill="#6f8398" font-size="11">Illustration only · time horizons vary by strategy · not financial advice</text>
</svg>
