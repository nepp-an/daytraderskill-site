<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="skillsTitle skillsDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="skillsTitle">Typical module chain for the eleven trader-* commands</title>
  <desc id="skillsDesc">A usual single-trade sequence is scanner, news, entry, exit, time machine, budget, risk, then broker, with alerts in parallel. Analyst and disclosure tools run on a schedule.</desc>
