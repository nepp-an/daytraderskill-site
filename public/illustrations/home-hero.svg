<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="heroTitle heroDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="heroTitle">The paper-first learning loop: learn, rehearse, review</title>
  <desc id="heroDesc">Three connected steps show a day trading education workflow that starts on paper and ends with a journal review. No prices, signals, or profit claims.</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13202d"/>
      <stop offset="1" stop-color="#0a1219"/>
    </linearGradient>
    <linearGradient id="heroLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d39a" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#59d39a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6fa8ee" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="heroGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="640" height="420" rx="24" fill="url(#heroBg)"/>
  <rect width="640" height="420" rx="24" fill="url(#heroGrid)"/>
  <circle cx="548" cy="42" r="92" fill="#59d39a" fill-opacity=".07"/>
  <circle cx="92" cy="388" r="112" fill="#437fbe" fill-opacity=".08"/>

  <text x="36" y="46" fill="#59d39a" font-size="12" font-weight="700" letter-spacing="2.4">PAPER-FIRST LOOP</text>
  <text x="36" y="82" fill="#eef5fb" font-size="26" font-weight="750" letter-spacing="-.6">Build skill before risk</text>
  <text x="36" y="108" fill="#93a8bc" font-size="13">A repeatable learning path — not a signal service.</text>

  <path d="M96 254H544" stroke="url(#heroLine)" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="96" cy="254" r="5" fill="#59d39a"/>
  <circle cx="320" cy="254" r="5" fill="#7fb8ff"/>
  <circle cx="544" cy="254" r="5" fill="#b39af2"/>

  <g>
    <rect x="36" y="154" width="164" height="150" rx="14" fill="#101c27" stroke="#2b4357"/>
    <rect x="52" y="172" width="34" height="34" rx="9" fill="#16293a" stroke="#37607f"/>
    <path d="M60 184h18M60 190h12" stroke="#8ab8ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M60 196h15" stroke="#8ab8ff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <text x="52" y="236" fill="#e9f0f7" font-size="16" font-weight="700">Learn</text>
    <text x="52" y="258" fill="#93a8bc" font-size="12">Mechanics, costs,</text>
    <text x="52" y="275" fill="#93a8bc" font-size="12">order types</text>
    <text x="52" y="292" fill="#6fa8ee" font-size="11" font-weight="700">01 · VOCABULARY</text>
  </g>

  <g>
    <rect x="238" y="154" width="164" height="150" rx="14" fill="#10231c" stroke="#2f5c4a"/>
    <rect x="254" y="172" width="34" height="34" rx="9" fill="#153026" stroke="#3b7e61"/>
    <path d="M262 181h6l3-4 4 12 3-8h8" stroke="#59d39a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="254" y="236" fill="#e9f0f7" font-size="16" font-weight="700">Rehearse</text>
    <text x="254" y="258" fill="#93a8bc" font-size="12">Same checklist,</text>
    <text x="254" y="275" fill="#93a8bc" font-size="12">simulated orders</text>
    <text x="254" y="292" fill="#59d39a" font-size="11" font-weight="700">02 · PAPER</text>
  </g>

  <g>
    <rect x="440" y="154" width="164" height="150" rx="14" fill="#191a2b" stroke="#473f6d"/>
    <rect x="456" y="172" width="34" height="34" rx="9" fill="#211f38" stroke="#5a4d8f"/>
    <path d="M464 183h8M464 189h16M464 195h11" stroke="#cfc0ff" stroke-width="2" stroke-linecap="round"/>
    <text x="456" y="236" fill="#e9f0f7" font-size="16" font-weight="700">Review</text>
    <text x="456" y="258" fill="#93a8bc" font-size="12">Journal decisions,</text>
    <text x="456" y="275" fill="#93a8bc" font-size="12">not just outcomes</text>
    <text x="456" y="292" fill="#b39af2" font-size="11" font-weight="700">03 · JOURNAL</text>
  </g>

  <g fill="#9bafc4" font-size="11">
    <rect x="36" y="340" width="128" height="30" rx="15" fill="#0d1720" stroke="#2b4357"/>
    <text x="52" y="359">No trade signals</text>
    <rect x="176" y="340" width="154" height="30" rx="15" fill="#0d1720" stroke="#2b4357"/>
    <text x="192" y="359">No profit promises</text>
    <rect x="342" y="340" width="174" height="30" rx="15" fill="#0d1720" stroke="#2b4357"/>
    <text x="358" y="359">AI order: Needs approval</text>
  </g>
</svg>
