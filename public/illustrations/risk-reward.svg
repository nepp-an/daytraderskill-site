<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="rrTitle rrDesc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="rrTitle">Risk to reward ratio</title>
  <desc id="rrDesc">A one risk unit loss compared with a three risk unit reward gives a 1 to 3 risk-reward ratio, before costs and hit rate.</desc>
  <defs>
    <linearGradient id="rrBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d29"/>
      <stop offset="1" stop-color="#0a1219"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="20" fill="url(#rrBg)"/>
  <rect x=".5" y=".5" width="719" height="299" rx="19.5" fill="none" stroke="#263648"/>

  <text x="32" y="42" fill="#59d39a" font-size="11" font-weight="700" letter-spacing="2.2">RISK / REWARD</text>
  <text x="32" y="73" fill="#eef5fb" font-size="23" font-weight="750" letter-spacing="-.4">Compare the distance to invalidation with the distance to target</text>

  <g>
    <text x="32" y="112" fill="#93a8bc" font-size="11" font-weight="700" letter-spacing="1.1">ENTRY</text>
    <line x1="32" y1="150" x2="688" y2="150" stroke="#33506a" stroke-width="1.5"/>
    <line x1="200" y1="132" x2="200" y2="168" stroke="#e9f0f7" stroke-width="2"/>
    <text x="188" y="188" fill="#e9f0f7" font-size="11" font-weight="700">ENTRY</text>

    <rect x="200" y="204" width="120" height="26" rx="5" fill="#3a211d" stroke="#7d4a3f"/>
    <text x="214" y="222" fill="#ffc1b6" font-size="11" font-weight="700">RISK · 1R</text>

    <line x1="200" y1="120" x2="200" y2="204" stroke="#ef8c7e" stroke-width="1.4" stroke-dasharray="3 4"/>
    <line x1="200" y1="120" x2="440" y2="120" stroke="#59d39a" stroke-width="2"/>
    <rect x="320" y="72" width="168" height="26" rx="5" fill="#123027" stroke="#2f6d53"/>
    <text x="334" y="90" fill="#9af0c7" font-size="11" font-weight="700">REWARD · 3R</text>
    <line x1="440" y1="98" x2="440" y2="150" stroke="#59d39a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="452" y="126" fill="#9af0c7" font-size="12" font-weight="700">Target</text>
    <text x="452" y="143" fill="#7e93a8" font-size="11">3× the stop distance</text>
  </g>

  <g>
    <rect x="32" y="246" width="656" height="34" rx="8" fill="#0d1720" stroke="#2b4357"/>
    <text x="48" y="268" fill="#dfe9f2" font-size="12" font-weight="650">R:R = 3.0 : 1 before costs · a ratio is not a probability and does not promise a win</text>
  </g>
</svg>
